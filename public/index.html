<!DOCTYPE html>
<html lang="en" data-theme="recall-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashRecall — RECALL · flashcards, fast</title>
  <meta name="description" content="FlashRecall: a zero-dependency, self-hosted spaced-repetition flashcard app.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237c6cff'/%3E%3Cpath d='M13 3 5 14h5l-1 7 8-11h-5l1-7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply cached theme before first paint to avoid a flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('recall.settings') || '{}');
        var root = document.documentElement;
        root.dataset.theme = s.theme || 'recall-dark';
        if (s.accent) root.style.setProperty('--accent', s.accent);
        if (s.fontSize) root.style.setProperty('--font-size', s.fontSize + 'px');
        if (s.borderRadius != null) root.style.setProperty('--radius', s.borderRadius + 'px');
        if (s.tint) root.style.setProperty('--tint', s.tint);
        if (s.reducedMotion) root.dataset.motion = 'reduced';
      } catch (e) { /* ignore corrupt cache */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
